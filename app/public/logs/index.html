<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Five Things — Logs</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .logs-page {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      height: 100vh;
      box-sizing: border-box;
    }

    .logs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .logs-header h1 {
      font-size: 1.5rem;
      color: var(--accent);
    }

    .logs-header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    [hidden] { display: none !important; }

    .log-box {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
      min-height: 0;
    }

    .log-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .log-box h2 {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .log-count {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .log-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.78rem;
      line-height: 1.6;
      color: var(--text);
    }

    .log-line {
      white-space: pre-wrap;
      word-break: break-all;
      padding: 0.1rem 0;
      border-bottom: 1px solid var(--border);
    }

    .log-line:last-child { border-bottom: none; }

    .log-group-body { overflow: hidden; }
    .log-group-body.collapsed { display: none; }

    .log-day-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.75rem;
      padding: 0.5rem 0 0.3rem;
      border-bottom: 1px solid var(--accent-dim);
      margin-bottom: 0.1rem;
      position: sticky;
      top: 0;
      background: var(--bg-surface);
      cursor: pointer;
      user-select: none;
    }

    .log-day-header:first-child { padding-top: 0; }

    .log-day-chevron {
      color: var(--text-muted);
      font-size: 0.65rem;
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }

    .log-day-header.collapsed .log-day-chevron { transform: rotate(-90deg); }

    .log-day-primary {
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .log-day-secondary {
      color: var(--text-muted);
      font-weight: 400;
    }

    .log-day-badge {
      margin-left: auto;
      background: var(--accent-dim);
      color: var(--text);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      min-width: 1.6rem;
      text-align: center;
    }

    .log-empty {
      color: var(--text-muted);
      font-style: italic;
    }

    .btn-back {
      font-size: 0.85rem;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      transition: background 0.15s, color 0.15s;
    }

    .btn-back:hover {
      background: var(--bg-surface);
      color: var(--accent-hover);
    }

    .btn-refresh {
      font-size: 0.85rem;
      background: var(--accent-dim);
      color: var(--text);
      border: none;
      border-radius: 6px;
      padding: 0.35rem 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-refresh:hover { background: var(--accent); }
  </style>
</head>
<body>
  <div class="logs-page">
    <div class="logs-header">
      <h1>Logs</h1>
      <div class="logs-header-actions">
        <button class="btn-refresh" id="refreshBtn">Refresh</button>
        <a class="btn-back" href="/">← Back</a>
      </div>
    </div>

    <div class="log-box" id="accessBox">
      <div class="log-box-header">
        <h2>Access</h2>
        <span class="log-count" id="accessCount"></span>
      </div>
      <div class="log-scroll" id="accessLog"></div>
    </div>

    <div class="log-box" id="flaggedBox" hidden>
      <div class="log-box-header">
        <h2>Flagged</h2>
        <span class="log-count" id="flaggedCount"></span>
      </div>
      <div class="log-scroll" id="flaggedLog"></div>
    </div>
  </div>

  <script src="logs.js"></script>
</body>
</html>
