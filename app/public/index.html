<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Five Things</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Theatre curtain SVG -->
  <div class="curtain-container" id="curtainContainer" aria-hidden="true">
    <!-- Curtain panels — scale to full viewport height -->
    <svg id="curtainSvg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 200 100">
      <defs>
        <!-- Left panel: outer edge → inner/center -->
        <linearGradient id="curtainGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   style="stop-color:var(--cs1)" />
          <stop offset="20%"  style="stop-color:var(--cs2)" />
          <stop offset="40%"  style="stop-color:var(--cs3)" />
          <stop offset="60%"  style="stop-color:var(--cs4)" />
          <stop offset="80%"  style="stop-color:var(--cs5)" />
          <stop offset="100%" style="stop-color:var(--cs6)" />
        </linearGradient>
        <!-- Right panel: inner/center → outer edge (mirror) -->
        <linearGradient id="curtainGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   style="stop-color:var(--cs6)" />
          <stop offset="20%"  style="stop-color:var(--cs5)" />
          <stop offset="40%"  style="stop-color:var(--cs4)" />
          <stop offset="60%"  style="stop-color:var(--cs3)" />
          <stop offset="80%"  style="stop-color:var(--cs2)" />
          <stop offset="100%" style="stop-color:var(--cs1)" />
        </linearGradient>
      </defs>
      <!-- Left curtain panel: straight outer edge, folds on inner side -->
      <g id="curtainLeft">
        <path d="M0,0 L0,100 L100,100 Q90,75 95,50 Q90,25 100,0 Z" fill="url(#curtainGradLeft)" />
        <!-- Folds -->
        <path d="M20,0 Q15,25 20,50 Q15,75 20,100" fill="none" stroke="var(--curtain-fold)" stroke-width="0.5" opacity="0.4"/>
        <path d="M40,0 Q35,25 40,50 Q35,75 40,100" fill="none" stroke="var(--curtain-fold)" stroke-width="0.5" opacity="0.4"/>
        <path d="M60,0 Q55,25 60,50 Q55,75 60,100" fill="none" stroke="var(--curtain-fold)" stroke-width="0.5" opacity="0.4"/>
        <path d="M80,0 Q75,25 80,50 Q75,75 80,100" fill="none" stroke="var(--curtain-fold)" stroke-width="0.5" opacity="0.4"/>
      </g>
      <!-- Right curtain panel: straight outer edge, folds on inner side -->
      <g id="curtainRight">
        <path d="M200,0 L200,100 L100,100 Q110,75 105,50 Q110,25 100,0 Z" fill="url(#curtainGradRight)" />
        <!-- Folds -->
        <path d="M180,0 Q185,25 180,50 Q185,75 180,100" fill="none" stroke="var(--curtain-fold)" stroke-width="0.5" opacity="0.4"/>
        <path d="M160,0 Q165,25 160,50 Q165,75 160,100" fill="none" stroke="var(--curtain-fold)" stroke-width="0.5" opacity="0.4"/>
        <path d="M140,0 Q145,25 140,50 Q145,75 140,100" fill="none" stroke="var(--curtain-fold)" stroke-width="0.5" opacity="0.4"/>
        <path d="M120,0 Q125,25 120,50 Q125,75 120,100" fill="none" stroke="var(--curtain-fold)" stroke-width="0.5" opacity="0.4"/>
      </g>
    </svg>
    <!-- Valance — fixed height, always on top, never scales vertically -->
    <svg id="valanceSvg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 200 17">
      <defs>
        <linearGradient id="valanceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   style="stop-color:var(--cs1)" />
          <stop offset="20%"  style="stop-color:var(--cs2)" />
          <stop offset="40%"  style="stop-color:var(--cs3)" />
          <stop offset="60%"  style="stop-color:var(--cs4)" />
          <stop offset="80%"  style="stop-color:var(--cs5)" />
          <stop offset="100%" style="stop-color:var(--cs1)" />
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="200" height="10" style="fill:var(--cs6)" />
      <path d="M0,10 Q25,16 50,10 Q75,16 100,10 Q125,16 150,10 Q175,16 200,10" fill="url(#valanceGrad)" stroke="var(--curtain-dark)" stroke-width="0.5"/>
    </svg>
  </div>

  <div class="theme-picker">
    <label for="themeSelect">Theme</label>
    <select id="themeSelect" aria-label="Theme">
      <option value="default">Default</option>
      <option value="rainbow">Rainbow</option>
      <option value="spotlight">Spotlight</option>
      <option value="greasepaint">Greasepaint</option>
      <option value="neon">Neon Stage</option>
      <option value="sockbuskin">Sock &amp; Buskin</option>
    </select>
  </div>

  <div class="page-wrapper">
    <header>
      <h1>Five Things</h1>
    </header>

    <main>
      <div class="content-col">
      <div class="controls" role="form" aria-label="Activity options">
        <div class="control-group">
          <label for="numSuggestions">Number of suggestions</label>
          <select id="numSuggestions" aria-label="Number of suggestions">
            <!-- populated by JS -->
          </select>
        </div>
        <div class="control-group">
          <label for="difficulty">Level of difficulty</label>
          <select id="difficulty" aria-label="Level of difficulty">
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
          </select>
        </div>
        <button id="getActivities" class="btn-primary">
          <span class="btn-primary-long-text">Update Activities</span>
          <span class="btn-primary-short-text">Update</span>
        </button>
      </div>

      <section id="activitiesArea" aria-live="polite" aria-label="Activities"></section>
      </div>
    </main>

    <footer>
      <p class="disclaimer">This site is intended for practice — during a match, engage the audience!</p>
      <p>&copy; <span id="footerYear"></span> Big Sea Moss</p>
      <p class="version"><span id="version"></span></p>
    </footer>
  </div>

  <!-- Flag confirmation modal -->
  <div id="flagModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="flagModalTitle" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h2 id="flagModalTitle">Flag for Review</h2>
      <p id="flagModalMessage"></p>
      <div class="modal-actions">
        <button id="flagConfirm" class="btn-flag">Flag It</button>
        <button id="flagCancel" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
